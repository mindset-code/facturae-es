[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "facturae-es"
version = "0.1.0"
description = "Facturae 3.2.2, el formato oficial de factura electronica en Espana, generado desde Python sin dependencias"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mindset & Code" }]
keywords = ["facturae", "factura-electronica", "espana", "xml", "aeat", "face"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6"]

[project.scripts]
facturae-es = "facturae_es.__main__:main"

[project.urls]
Homepage = "https://mindset-code.com"
Repositorio = "https://github.com/mindset-code/facturae-es"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["facturae_es"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", 'if __name__ == .__main__.:']
show_missing = true

[tool.ruff]
line-length = 95
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
