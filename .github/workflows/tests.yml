name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # El esquema lo publica el Ministerio: una vez por semana comprobamos que
    # sigue coincidiendo con lo que generamos.
    - cron: "17 6 * * 1"

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
